apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp7-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exp7-app
  template:
    metadata:
      labels:
        app: exp7-app
    spec:
      containers:
      - name: exp7-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: exp7-service
spec:
  type: NodePort
  selector:
    app: exp7-app
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30007
